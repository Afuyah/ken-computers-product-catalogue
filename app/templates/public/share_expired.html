{% extends "public/base.html" %}
{% block title %}Link expired — {{ site_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-slate-200 bg-white p-8 text-center">
  <div class="text-4xl">⏳</div>
  <h1 class="mt-3 text-xl font-black">This link is no longer available</h1>
  <p class="mt-2 text-sm text-slate-600">
    “{{ link.title }}” has expired or was withdrawn. Ask us for a fresh link and we will resend it.
  </p>
  <div class="mt-5 flex justify-center gap-2">
    <a class="btn-whatsapp" href="https://wa.me/{{ contact_whatsapp }}" target="_blank" rel="noopener">Ask on WhatsApp</a>
    <a class="btn-outline" href="{{ url_for('public.home') }}">Browse catalogue</a>
  </div>
</div>
{% endblock %}
