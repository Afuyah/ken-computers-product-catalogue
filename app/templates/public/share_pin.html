{% extends "public/base.html" %}
{% block title %}{{ link.title }} — {{ site_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <div class="rounded-2xl border border-slate-200 bg-white p-6">
    <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-700">Protected selection</p>
    <h1 class="mt-2 text-xl font-black">{{ link.title }}</h1>
    <p class="mt-2 text-sm text-slate-600">Enter the PIN you were given to view this selection.</p>

    <form method="post" class="mt-5 space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="label" for="pin">PIN</label>
        <input class="input text-center text-lg tracking-[0.4em]" id="pin" name="pin"
               inputmode="numeric" autocomplete="one-time-code" required autofocus>
      </div>
      <button class="btn-primary w-full" type="submit">Unlock</button>
    </form>
  </div>
</div>
{% endblock %}
