{% extends "public/base.html" %}
{% block title %}{{ code }} — {{ site_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-slate-200 bg-white p-10 text-center">
  <p class="text-5xl font-black text-slate-300">{{ code }}</p>
  <h1 class="mt-3 text-xl font-black">{{ message }}</h1>
  <p class="mt-2 text-sm text-slate-600">Let's get you back to the catalogue.</p>
  <div class="mt-5 flex justify-center gap-2">
    <a class="btn-primary" href="{{ url_for('public.home') }}">Back home</a>
    <a class="btn-outline" href="{{ url_for('public.search') }}">Browse products</a>
  </div>
</div>
{% endblock %}
